<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Press+Start+2P&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">

    <title>PokéMoon</title>

</head>

<body>

    <header class="navbar">

        <div class="logo">

            <span class="logo-anime">
                POKE
            </span>

            <span class="logo-verse">
                MOON
            </span>

        </div>

        <nav>

            <a href="#home">
                Home
            </a>

            <a href="#pokemon">
                Pokémon
            </a>

        </nav>

    </header>

    <main>

        <section
            class="HOME"
            id="home"
        >

            <div class="contents">

                <p class="labels">
                    POKEMON API
                </p>

                <h1>
                    Explore the
                    <span>POKEMON</span>
                    World
                </h1>

                <p class="pokedescription">
                    Search and discover some Pokémon,
                    their types, abilities, stats, and more!
                </p>

                <div class="container">

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search for Pokemon..."
                    >

                    <button
                        id="searchButton"
                    >
                        Search
                    </button>

                </div>

            </div>

        </section>

        <section
            class="pokemon-section"
            id="pokemon"
        >

            <div class="section-header">

                <div>

                    <p class="section-label">
                        POKÉDEX
                    </p>

                    <h2>
                        Pokémon
                    </h2>

                </div>

                <p
                    class="pokemon-count"
                    id="pokemonCount"
                >
                    Explore the collection
                </p>

            </div>

            <div
                class="pokemon-grid"
                id="pokemonGrid"
            >

            </div>

            <p
                class="message"
                id="message"
            >

            </p>

        </section>

        <section
            class="pokemon-details-section"
            id="pokemonDetails"
        >

            <button
                class="back-button"
                id="backButton"
            >
                ← BACK
            </button>

            <div
                class="pokemon-details-content"
                id="pokemonDetailsContent"
            >

            </div>

        </section>

    </main>

    <footer>

        <p>
            Pokémon API Project
        </p>

    </footer>

    <script src="script.js"></script>

</body>

</html>
